name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Create Android assets directory
        run: mkdir -p android/app/src/main/assets

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Generate Keystore
        run: |
          keytool -genkey -v             -keystore $GITHUB_WORKSPACE/android/app/klasmeyt-release.jks             -alias klasmeyt             -keyalg RSA             -keysize 2048             -validity 10000             -storepass klasmeyt2024             -keypass klasmeyt2024             -dname "CN=Klasmeyt App, OU=Klasmeyt, O=Klasmeyt, L=Tangub City, ST=Misamis Occidental, C=PH"

      - name: Verify Keystore exists
        run: ls -la $GITHUB_WORKSPACE/android/app/

      - name: Build Release APK + AAB
        run: |
          cd android
          ./gradlew assembleRelease bundleRelease             -Pandroid.injected.signing.store.file=$GITHUB_WORKSPACE/android/app/klasmeyt-release.jks             -Pandroid.injected.signing.store.password=klasmeyt2024             -Pandroid.injected.signing.key.alias=klasmeyt             -Pandroid.injected.signing.key.password=klasmeyt2024

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: klasmeyt-release.apk
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30

      - name: Upload Release AAB
        uses: actions/upload-artifact@v4
        with:
          name: klasmeyt-release.aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30
